<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" font-family="'Segoe UI', system-ui, sans-serif">
  <text x="20" y="30" font-size="18" fill="#3a3126" font-weight="700">DBSCAN — core, border and noise points</text>

  <!-- clusters -->
  <!-- cluster 1 -->
  <circle cx="140" cy="150" r="8" fill="#16a34a"/><circle cx="180" cy="130" r="8" fill="#16a34a"/><circle cx="175" cy="185" r="8" fill="#16a34a"/>
  <circle cx="140" cy="210" r="8" fill="#16a34a"/><circle cx="110" cy="180" r="8" fill="#16a34a"/><circle cx="220" cy="160" r="8" fill="#16a34a"/>
  <circle cx="150" cy="110" r="8" fill="#16a34a"/>
  <!-- radius circle -->
  <circle cx="160" cy="160" r="70" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- cluster 2 -->
  <circle cx="480" cy="150" r="8" fill="#2563eb"/><circle cx="520" cy="130" r="8" fill="#2563eb"/><circle cx="515" cy="185" r="8" fill="#2563eb"/>
  <circle cx="480" cy="210" r="8" fill="#2563eb"/><circle cx="450" cy="180" r="8" fill="#2563eb"/>
  <circle cx="500" cy="200" r="8" fill="#2563eb"/>
  <circle cx="500" cy="150" r="70" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- border points (slightly outside dense core) -->
  <circle cx="240" cy="215" r="8" fill="#f59e0b"/>
  <circle cx="430" cy="120" r="8" fill="#f59e0b"/>

  <!-- noise -->
  <circle cx="330" cy="70" r="8" fill="#94a3b8"/>
  <circle cx="600" cy="260" r="8" fill="#94a3b8"/>
  <circle cx="60" cy="80" r="8" fill="#94a3b8"/>

  <!-- legend -->
  <rect x="470" y="235" width="200" height="95" rx="8" fill="#f8f5ec" stroke="#d8c9a8" stroke-width="1.5"/>
  <circle cx="492" cy="255" r="7" fill="#16a34a"/><text x="510" y="259" font-size="12">core point (≥ MinPts in ε)</text>
  <circle cx="492" cy="278" r="7" fill="#f59e0b"/><text x="510" y="282" font-size="12">border point</text>
  <circle cx="492" cy="301" r="7" fill="#94a3b8"/><text x="510" y="305" font-size="12">noise (outlier)</text>

  <text x="20" y="330" font-size="13" fill="#b45309">ε = neighbourhood radius, MinPts = minimum neighbours. DBSCAN finds arbitrary-shaped clusters and labels outliers; it does not need k.</text>
</svg>