<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="'Segoe UI', system-ui, sans-serif">
  <text x="20" y="30" font-size="18" fill="#3a3126" font-weight="700">Hierarchical Clustering — agglomerative vs divisive</text>

  <!-- Agglomerative: bottom-up -->
  <text x="150" y="58" font-size="14" fill="#2563eb" font-weight="700" text-anchor="middle">Agglomerative (bottom-up)</text>
  <text x="150" y="76" font-size="12" fill="#1e3a8a" text-anchor="middle">start: every point is a cluster → merge closest pairs</text>

  <!-- dendrogram -->
  <line x1="60" y1="250" x2="60" y2="100" stroke="#3a3126" stroke-width="2"/>

  <!-- leaves a b c d e -->
  <text x="80" y="268" font-size="13">a</text><text x="140" y="268" font-size="13">b</text><text x="230" y="268" font-size="13">c</text><text x="310" y="268" font-size="13">d</text><text x="380" y="268" font-size="13">e</text>

  <line x1="80" y1="258" x2="80" y2="230" stroke="#3a3126" stroke-width="1.5"/><line x1="140" y1="258" x2="140" y2="230" stroke="#3a3126" stroke-width="1.5"/>
  <line x1="80" y1="230" x2="140" y2="230" stroke="#2563eb" stroke-width="2"/>
  <line x1="110" y1="230" x2="110" y2="200" stroke="#3a3126" stroke-width="1.5"/>

  <line x1="230" y1="258" x2="230" y2="230" stroke="#3a3126" stroke-width="1.5"/><line x1="310" y1="258" x2="310" y2="230" stroke="#3a3126" stroke-width="1.5"/>
  <line x1="230" y1="230" x2="310" y2="230" stroke="#2563eb" stroke-width="2"/>
  <line x1="270" y1="230" x2="270" y2="185" stroke="#3a3126" stroke-width="1.5"/>

  <line x1="110" y1="200" x2="270" y2="200" stroke="#2563eb" stroke-width="2"/>
  <line x1="190" y1="200" x2="190" y2="170" stroke="#3a3126" stroke-width="1.5"/>

  <line x1="380" y1="258" x2="380" y2="170" stroke="#3a3126" stroke-width="1.5"/>

  <line x1="190" y1="170" x2="380" y2="170" stroke="#2563eb" stroke-width="2"/>
  <text x="110" y="245" font-size="10" fill="#1e3a8a">C1</text>
  <text x="270" y="245" font-size="10" fill="#1e3a8a">C2</text>

  <!-- Divisive: top-down -->
  <text x="530" y="58" font-size="14" fill="#dc2626" font-weight="700" text-anchor="middle">Divisive (top-down)</text>
  <text x="530" y="76" font-size="12" fill="#7f1d1d" text-anchor="middle">start with one cluster → split by largest distance</text>

  <rect x="440" y="100" width="180" height="26" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="530" y="117" font-size="12" text-anchor="middle">{a, b, c, d, e}</text>

  <line x1="500" y1="126" x2="470" y2="160" stroke="#3a3126" stroke-width="1.5"/>
  <line x1="560" y1="126" x2="590" y2="160" stroke="#3a3126" stroke-width="1.5"/>
  <rect x="430" y="160" width="90" height="24" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="475" y="176" font-size="12" text-anchor="middle">{a, b, c}</text>
  <rect x="545" y="160" width="90" height="24" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="590" y="176" font-size="12" text-anchor="middle">{d, e}</text>

  <line x1="455" y1="184" x2="445" y2="214" stroke="#3a3126" stroke-width="1.5"/>
  <line x1="495" y1="184" x2="505" y2="214" stroke="#3a3126" stroke-width="1.5"/>
  <rect x="415" y="214" width="60" height="22" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="445" y="229" font-size="11" text-anchor="middle">{a, b}</text>
  <rect x="485" y="214" width="50" height="22" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="510" y="229" font-size="11" text-anchor="middle">{c}</text>

  <text x="30" y="290" font-size="13" fill="#b45309">A dendrogram records merge/split heights; cutting it at a level gives a chosen number of clusters. Linkage (single, complete, average) defines distance between clusters.</text>
</svg>