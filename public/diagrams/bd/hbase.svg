<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="'Segoe UI', system-ui, sans-serif">
  <text x="20" y="30" font-size="18" fill="#3a3126" font-weight="700">HBase Architecture — region servers over HDFS</text>

  <!-- client -->
  <rect x="40" y="60" width="110" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="95" y="85" font-size="13" text-anchor="middle" fill="#1e3a8a" font-weight="700">Client</text>

  <!-- ZK -->
  <rect x="200" y="60" width="150" height="40" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="275" y="78" font-size="12" text-anchor="middle" fill="#78350f" font-weight="700">ZooKeeper</text>
  <text x="275" y="93" font-size="10.5" text-anchor="middle" fill="#78350f">.ROOT- &amp; .META- location</text>
  <line x1="150" y1="80" x2="198" y2="80" stroke="#3a3126" stroke-width="1.6"/>

  <!-- HMaster -->
  <rect x="400" y="60" width="140" height="40" rx="8" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="470" y="78" font-size="12" text-anchor="middle" fill="#5b21b6" font-weight="700">HMaster</text>
  <text x="470" y="93" font-size="10.5" text-anchor="middle" fill="#5b21b6">assigns regions, DDL, balancing</text>
  <line x1="350" y1="80" x2="398" y2="80" stroke="#3a3126" stroke-width="1.6"/>

  <!-- RegionServers -->
  <rect x="90" y="200" width="140" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="160" y="224" font-size="12" text-anchor="middle" fill="#14532d" font-weight="700">RegionServer 1</text>
  <text x="160" y="243" font-size="10.5" text-anchor="middle" fill="#14532d">regions A1..A9 · MemStore · WAL</text>

  <rect x="280" y="200" width="140" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="350" y="224" font-size="12" text-anchor="middle" fill="#14532d" font-weight="700">RegionServer 2</text>
  <text x="350" y="243" font-size="10.5" text-anchor="middle" fill="#14532d">regions B1..B9 · MemStore · WAL</text>

  <rect x="470" y="200" width="140" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="540" y="224" font-size="12" text-anchor="middle" fill="#14532d" font-weight="700">RegionServer 3</text>
  <text x="540" y="243" font-size="10.5" text-anchor="middle" fill="#14532d">regions C1..C9 · MemStore · WAL</text>

  <line x1="95" y1="100" x2="160" y2="198" stroke="#3a3126" stroke-width="1.6"/>
  <line x1="470" y1="100" x2="350" y2="198" stroke="#3a3126" stroke-width="1.6" stroke-dasharray="4 3"/>

  <!-- HDFS -->
  <rect x="90" y="310" width="520" height="45" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="350" y="338" font-size="13" text-anchor="middle" fill="#7f1d1d" font-weight="700">HDFS — durable block storage (WAL and HFiles)</text>
  <line x1="160" y1="260" x2="160" y2="308" stroke="#3a3126" stroke-width="1.6"/>
  <line x1="350" y1="260" x2="350" y2="308" stroke="#3a3126" stroke-width="1.6"/>
  <line x1="540" y1="260" x2="540" y2="308" stroke="#3a3126" stroke-width="1.6"/>

  <text x="30" y="382" font-size="12.5" fill="#3a3126">Data is a sorted map: row key → {column family: [qualifier, timestamp] → value}.</text>
  <text x="30" y="402" font-size="12.5" fill="#b45309">New values go to the MemStore (memory) and WAL (log); when the MemStore fills it is flushed to an HFile.</text>
</svg>