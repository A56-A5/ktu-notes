<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="'Segoe UI', system-ui, sans-serif">
  <text x="20" y="30" font-size="18" fill="#3a3126" font-weight="700">HDFS Architecture - NameNode and DataNodes</text>

  <!-- NameNode -->
  <rect x="270" y="60" width="160" height="60" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="350" y="85" font-size="14" text-anchor="middle" fill="#78350f" font-weight="700">NameNode</text>
  <text x="350" y="105" font-size="11" text-anchor="middle" fill="#78350f">metadata: file → blocks → locations</text>

  <!-- client -->
  <rect x="40" y="70" width="110" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="95" y="95" font-size="13" text-anchor="middle" fill="#1e3a8a" font-weight="700">Client</text>
  <line x1="150" y1="90" x2="268" y2="90" stroke="#3a3126" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="210" y="82" font-size="10.5" text-anchor="middle" fill="#3a3126">1. metadata ops</text>

  <!-- DataNodes row -->
  <rect x="90" y="230" width="120" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="150" y="253" font-size="12.5" text-anchor="middle" fill="#14532d" font-weight="700">DataNode 1</text>
  <text x="150" y="270" font-size="10.5" text-anchor="middle" fill="#14532d">rack 1</text>

  <rect x="290" y="230" width="120" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="350" y="253" font-size="12.5" text-anchor="middle" fill="#14532d" font-weight="700">DataNode 2</text>
  <text x="350" y="270" font-size="10.5" text-anchor="middle" fill="#14532d">rack 2</text>

  <rect x="490" y="230" width="120" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="550" y="253" font-size="12.5" text-anchor="middle" fill="#14532d" font-weight="700">DataNode 3</text>
  <text x="550" y="270" font-size="10.5" text-anchor="middle" fill="#14532d">rack 3</text>

  <line x1="320" y1="120" x2="160" y2="228" stroke="#3a3126" stroke-width="1.6"/>
  <line x1="350" y1="120" x2="350" y2="228" stroke="#3a3126" stroke-width="1.6"/>
  <line x1="380" y1="120" x2="540" y2="228" stroke="#3a3126" stroke-width="1.6"/>
  <text x="250" y="165" font-size="10.5" fill="#3a3126" text-anchor="middle">2. block locations</text>

  <!-- client data path -->
  <line x1="95" y1="110" x2="95" y2="228" stroke="#2563eb" stroke-width="2"/>
  <text x="100" y="185" font-size="10.5" fill="#2563eb">3. read/write blocks</text>

  <text x="20" y="330" font-size="12.5" fill="#3a3126">HDFS splits files into large blocks (default 128 MB) and replicates each block (default 3×) on different racks.</text>
  <text x="20" y="352" font-size="12.5" fill="#3a3126">The NameNode holds only metadata; the Client streams block data directly to/from DataNodes.</text>
  <text x="20" y="374" font-size="12.5" fill="#b45309">The NameNode is a single point of failure unless run in HA with a standby + JournalNode quorum.</text>
</svg>