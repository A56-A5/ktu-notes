<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" font-family="'Segoe UI', system-ui, sans-serif">
  <text x="20" y="30" font-size="18" fill="#3a3126" font-weight="700">Graph Traversal Order — BFS vs DFS</text>
  <text x="20" y="52" font-size="13.5" fill="#3a3126">Same graph, start A. BFS explores level by level (queue/FIFO); DFS dives deep first (stack/LIFO).</text>

  <!-- graph: A-B, A-C, B-D, C-E, D-F -->
  <!-- Nodes -->
  <circle cx="200" cy="110" r="20" fill="#fef3c7" stroke="#3a3126" stroke-width="2"/><text x="200" y="116" font-size="14" text-anchor="middle">A</text>
  <circle cx="110" cy="200" r="20" fill="#fef3c7" stroke="#3a3126" stroke-width="2"/><text x="110" y="206" font-size="14" text-anchor="middle">B</text>
  <circle cx="290" cy="200" r="20" fill="#fef3c7" stroke="#3a3126" stroke-width="2"/><text x="290" y="206" font-size="14" text-anchor="middle">C</text>
  <circle cx="60" cy="290" r="20" fill="#fef3c7" stroke="#3a3126" stroke-width="2"/><text x="60" y="296" font-size="14" text-anchor="middle">D</text>
  <circle cx="340" cy="290" r="20" fill="#fef3c7" stroke="#3a3126" stroke-width="2"/><text x="340" y="296" font-size="14" text-anchor="middle">E</text>
  <circle cx="120" cy="300" r="20" fill="#fef3c7" stroke="#3a3126" stroke-width="2" visibility="hidden"/>
  <!-- edges -->
  <line x1="190" y1="128" x2="122" y2="182" stroke="#3a3126" stroke-width="2"/>
  <line x1="210" y1="128" x2="278" y2="182" stroke="#3a3126" stroke-width="2"/>
  <line x1="104" y1="219" x2="72" y2="272" stroke="#3a3126" stroke-width="2"/>
  <line x1="300" y1="219" x2="332" y2="272" stroke="#3a3126" stroke-width="2"/>

  <!-- BFS panel -->
  <rect x="400" y="80" width="280" height="100" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="418" y="106" font-size="13" fill="#1e3a8a" font-weight="700">BFS from A (queue)</text>
  <text x="418" y="130" font-size="12.5" fill="#1e3a8a">visit order: A → B, C → D, E</text>
  <text x="418" y="152" font-size="12.5" fill="#1e3a8a">queue grows level by level</text>
  <text x="418" y="172" font-size="12.5" fill="#1e3a8a">Time O(V+E) with adjacency lists</text>

  <!-- DFS panel -->
  <rect x="400" y="200" width="280" height="100" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="418" y="226" font-size="13" fill="#7f1d1d" font-weight="700">DFS from A (stack, recurse)</text>
  <text x="418" y="250" font-size="12.5" fill="#7f1d1d">visit order: A → B → D → … → C → E</text>
  <text x="418" y="272" font-size="12.5" fill="#7f1d1d">dives to a leaf before backtracking</text>
  <text x="418" y="294" font-size="12.5" fill="#7f1d1d">needs O(h) recursion stack</text>

  <text x="20" y="335" font-size="13" fill="#b45309">BFS finds shortest paths in unweighted graphs; DFS classifies edges and detects cycles/strongly connected components.</text>
</svg>