<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" font-family="'Segoe UI', system-ui, sans-serif">
  <text x="20" y="30" font-size="18" fill="#3a3126" font-weight="700">Complexity Classes — P, NP, NP-Hard, NP-Complete</text>

  <!-- outer NP-hard ellipse -->
  <ellipse cx="350" cy="200" rx="300" ry="130" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="560" y="120" font-size="14" fill="#7f1d1d" font-weight="700">NP-Hard</text>
  <text x="560" y="140" font-size="12" fill="#7f1d1d">≥ as hard as every NP problem; need not be in NP</text>

  <!-- NP ellipse -->
  <ellipse cx="330" cy="205" rx="210" ry="95" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="180" y="140" font-size="14" fill="#1e3a8a" font-weight="700">NP</text>
  <text x="180" y="160" font-size="12" fill="#1e3a8a">verifiable in polynomial time</text>

  <!-- NP-Complete overlap -->
  <ellipse cx="330" cy="205" rx="130" ry="60" fill="#fef9c3" stroke="#b45309" stroke-width="2"/>
  <text x="330" y="200" font-size="14" fill="#78350f" font-weight="700">NP-Complete</text>
  <text x="330" y="220" font-size="11.5" fill="#78350f">in NP and NP-hard</text>

  <!-- P circle inside NP -->
  <circle cx="330" cy="200" r="42" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="330" y="205" font-size="15" fill="#14532d" font-weight="700">P</text>

  <!-- Legend -->
  <rect x="80" y="300" width="540" height="62" rx="8" fill="#f8f5ec" stroke="#d8c9a8" stroke-width="1.5"/>
  <text x="100" y="322" font-size="12.5" fill="#3a3126"><tspan font-weight="700">P</tspan> — decision problems solvable in polynomial time (sorting, shortest path).</text>
  <text x="100" y="342" font-size="12.5" fill="#3a3126"><tspan font-weight="700">NP</tspan> — decision problems whose YES answers can be verified in polynomial time; P ⊆ NP.</text>
  <text x="100" y="362" font-size="12.5" fill="#3a3126">Open question: is P = NP? (the P vs NP problem — one of the Clay Millennium Problems).</text>
</svg>