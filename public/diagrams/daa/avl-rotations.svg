<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="'Segoe UI', system-ui, sans-serif">
  <!-- Title -->
  <text x="20" y="30" font-size="18" fill="#3a3126" font-weight="700">AVL Tree Insertion - Balance Factors and Rotations</text>

  <!-- LEFT: unbalanced tree with balance factors (RR case) -->
  <text x="30" y="70" font-size="15" fill="#7c3aed" font-weight="700">RR (imbalance at node 30, heavy right) → single LEFT rotation</text>

  <!-- unbalanced tree: 30 (bf+2) -> 40 (bf+1) -> 50 -->
  <ellipse cx="80" cy="130" rx="20" ry="20" fill="#fef3c7" stroke="#3a3126" stroke-width="2"/>
  <text x="80" y="135" font-size="14" text-anchor="middle" fill="#3a3126">30</text>
  <text x="80" y="105" font-size="13" text-anchor="middle" fill="#dc2626" font-weight="700">+2</text>
  <ellipse cx="80" cy="210" rx="20" ry="20" fill="#fef3c7" stroke="#3a3126" stroke-width="2"/>
  <text x="80" y="215" font-size="14" text-anchor="middle" fill="#3a3126">40</text>
  <text x="80" y="185" font-size="13" text-anchor="middle" fill="#dc2626" font-weight="700">+1</text>
  <line x1="80" y1="150" x2="80" y2="190" stroke="#3a3126" stroke-width="2"/>
  <ellipse cx="80" cy="290" rx="20" ry="20" fill="#fef3c7" stroke="#3a3126" stroke-width="2"/>
  <text x="80" y="295" font-size="14" text-anchor="middle" fill="#3a3126">50</text>
  <line x1="80" y1="230" x2="80" y2="270" stroke="#3a3126" stroke-width="2"/>
  <!-- arrow -->
  <path d="M 150 190 L 230 190" stroke="#16a34a" stroke-width="3" marker-end="url(#arrg)"/>
  <text x="190" y="180" font-size="14" fill="#16a34a" text-anchor="middle" font-weight="700">rotate L</text>

  <!-- RIGHT: balanced tree -->
  <ellipse cx="360" cy="150" rx="20" ry="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="360" y="155" font-size="14" text-anchor="middle" fill="#3a3126">40</text>
  <text x="360" y="125" font-size="13" text-anchor="middle" fill="#16a34a" font-weight="700">0</text>
  <line x1="342" y1="168" x2="330" y2="230" stroke="#3a3126" stroke-width="2"/>
  <line x1="378" y1="168" x2="390" y2="230" stroke="#3a3126" stroke-width="2"/>
  <ellipse cx="320" cy="260" rx="20" ry="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="320" y="265" font-size="14" text-anchor="middle" fill="#3a3126">30</text>
  <text x="320" y="235" font-size="13" text-anchor="middle" fill="#16a34a">0</text>
  <ellipse cx="400" cy="260" rx="20" ry="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="400" y="265" font-size="14" text-anchor="middle" fill="#3a3126">50</text>
  <text x="400" y="235" font-size="13" text-anchor="middle" fill="#16a34a">0</text>

  <!-- ====== BOTTOM ROW: LR case ====== -->
  <text x="30" y="330" font-size="15" fill="#7c3aed" font-weight="700">LR case: fix with DOUBLE rotation - L on child, then R on node</text>

  <!-- unbalanced: 50(-2) -> L 30(+1) -> R 40 -->
  <ellipse cx="80" cy="380" rx="20" ry="20" fill="#fef3c7" stroke="#3a3126" stroke-width="2"/>
  <text x="80" y="385" font-size="14" text-anchor="middle" fill="#3a3126">50</text>
  <text x="80" y="355" font-size="13" text-anchor="middle" fill="#dc2626" font-weight="700">−2</text>
  <line x1="68" y1="398" x2="58" y2="418" stroke="#3a3126" stroke-width="2"/>
  <ellipse cx="52" cy="445" rx="20" ry="20" fill="#fef3c7" stroke="#3a3126" stroke-width="2"/>
  <text x="52" y="450" font-size="14" text-anchor="middle" fill="#3a3126">30</text>
  <text x="52" y="420" font-size="13" text-anchor="middle" fill="#dc2626" font-weight="700">+1</text>
  <line x1="70" y1="445" x2="110" y2="445" stroke="#3a3126" stroke-width="2"/>
  <ellipse cx="132" cy="445" rx="20" ry="20" fill="#fef3c7" stroke="#3a3126" stroke-width="2"/>
  <text x="132" y="450" font-size="14" text-anchor="middle" fill="#3a3126">40</text>

  <path d="M 200 430 L 300 430" stroke="#16a34a" stroke-width="3" marker-end="url(#arrg)"/>
  <text x="250" y="420" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="700">L then R</text>

  <!-- balanced after LR: root 40 -->
  <ellipse cx="380" cy="390" rx="20" ry="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="380" y="395" font-size="14" text-anchor="middle" fill="#3a3126">40</text>
  <text x="380" y="365" font-size="13" text-anchor="middle" fill="#16a34a">0</text>
  <line x1="362" y1="408" x2="346" y2="435" stroke="#3a3126" stroke-width="2"/>
  <line x1="398" y1="408" x2="414" y2="435" stroke="#3a3126" stroke-width="2"/>
  <ellipse cx="336" cy="455" rx="20" ry="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="336" y="460" font-size="14" text-anchor="middle" fill="#3a3126">30</text>
  <ellipse cx="424" cy="455" rx="20" ry="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="424" y="460" font-size="14" text-anchor="middle" fill="#3a3126">50</text>

  <!-- legend -->
  <text x="470" y="390" font-size="13" fill="#3a3126">bf = height(right) − height(left)</text>
  <text x="470" y="412" font-size="13" fill="#3a3126">Unbalanced ⇒ bf = +2 or −2 on a node</text>
  <text x="470" y="434" font-size="13" fill="#16a34a">Single rot: LL → right, RR → left</text>
  <text x="470" y="456" font-size="13" fill="#b45309">Double rot: LR → left-then-right, RL → right-then-left</text>

  <defs>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>