<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="'Segoe UI', system-ui, sans-serif">
  <text x="20" y="30" font-size="18" fill="#3a3126" font-weight="700">Merge Sort — Divide and Conquer</text>

  <!-- top: unsorted array -->
  <text x="60" y="70" font-size="13" fill="#3a3126" font-weight="700">unsorted</text>
  <rect x="60" y="80" width="40" height="32" fill="#dbeafe" stroke="#3a3126" stroke-width="1.5"/><text x="80" y="101" font-size="13" text-anchor="middle">38</text>
  <rect x="100" y="80" width="40" height="32" fill="#dbeafe" stroke="#3a3126" stroke-width="1.5"/><text x="120" y="101" font-size="13" text-anchor="middle">27</text>
  <rect x="140" y="80" width="40" height="32" fill="#dbeafe" stroke="#3a3126" stroke-width="1.5"/><text x="160" y="101" font-size="13" text-anchor="middle">43</text>
  <rect x="180" y="80" width="40" height="32" fill="#dbeafe" stroke="#3a3126" stroke-width="1.5"/><text x="200" y="101" font-size="13" text-anchor="middle">3</text>
  <rect x="220" y="80" width="40" height="32" fill="#dbeafe" stroke="#3a3126" stroke-width="1.5"/><text x="240" y="101" font-size="13" text-anchor="middle">9</text>
  <rect x="260" y="80" width="40" height="32" fill="#dbeafe" stroke="#3a3126" stroke-width="1.5"/><text x="280" y="101" font-size="13" text-anchor="middle">82</text>

  <!-- divide -->
  <line x1="80" y1="150" x2="80" y2="112" stroke="#b45309" stroke-width="2"/>
  <line x1="160" y1="150" x2="160" y2="112" stroke="#b45309" stroke-width="2"/>
  <line x1="240" y1="150" x2="240" y2="112" stroke="#b45309" stroke-width="2"/>
  <text x="60" y="168" font-size="12" fill="#b45309">split mid</text>

  <!-- level 1 split -->
  <text x="30" y="195" font-size="12" fill="#3a3126" font-weight="700">split</text>
  <rect x="60" y="180" width="80" height="30" fill="#fef3c7" stroke="#3a3126" stroke-width="1.5"/><text x="100" y="200" font-size="12" text-anchor="middle">38 27</text>
  <rect x="150" y="180" width="90" height="30" fill="#fef3c7" stroke="#3a3126" stroke-width="1.5"/><text x="195" y="200" font-size="12" text-anchor="middle">43 3 9</text>
  <rect x="250" y="180" width="50" height="30" fill="#fef3c7" stroke="#3a3126" stroke-width="1.5"/><text x="275" y="200" font-size="12" text-anchor="middle">82</text>

  <!-- split again -->
  <line x1="100" y1="210" x2="80" y2="248" stroke="#b45309" stroke-width="1.5"/>
  <line x1="100" y1="210" x2="120" y2="248" stroke="#b45309" stroke-width="1.5"/>
  <line x1="195" y1="210" x2="170" y2="248" stroke="#b45309" stroke-width="1.5"/>
  <line x1="195" y1="210" x2="220" y2="248" stroke="#b45309" stroke-width="1.5"/>

  <!-- level 2 base -->
  <rect x="60" y="250" width="40" height="28" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="80" y="269" font-size="12" text-anchor="middle">38</text>
  <rect x="100" y="250" width="40" height="28" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="120" y="269" font-size="12" text-anchor="middle">27</text>
  <rect x="150" y="250" width="40" height="28" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="170" y="269" font-size="12" text-anchor="middle">43</text>
  <rect x="190" y="250" width="40" height="28" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="210" y="269" font-size="12" text-anchor="middle">3</text>
  <rect x="230" y="250" width="40" height="28" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="250" y="269" font-size="12" text-anchor="middle">9</text>
  <rect x="270" y="250" width="40" height="28" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="290" y="269" font-size="12" text-anchor="middle">82</text>

  <!-- conquer -->
  <line x1="100" y1="278" x2="100" y2="312" stroke="#16a34a" stroke-width="1.5"/>
  <line x1="195" y1="278" x2="195" y2="312" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="260" font-size="12" fill="#16a34a">merge</text>

  <!-- merged -->
  <rect x="60" y="314" width="90" height="30" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="105" y="334" font-size="12" text-anchor="middle">27 38</text>
  <rect x="160" y="314" width="100" height="30" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="210" y="334" font-size="12" text-anchor="middle">3 9 43</text>
  <rect x="270" y="314" width="50" height="30" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="295" y="334" font-size="12" text-anchor="middle">82</text>

  <!-- final merge -->
  <rect x="100" y="360" width="180" height="32" fill="#16a34a" opacity="0.15" stroke="#16a34a" stroke-width="2"/><text x="190" y="381" font-size="13" text-anchor="middle" fill="#14532d" font-weight="700">3 9 27 38 43 82</text>
  <text x="300" y="380" font-size="12" fill="#16a34a">sorted ✓</text>
</svg>