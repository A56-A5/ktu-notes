<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="'Segoe UI', system-ui, sans-serif">
  <text x="20" y="30" font-size="18" fill="#3a3126" font-weight="700">Master's Theorem - T(n) = a·T(n/b) + f(n),  a ≥ 1, b &gt; 1</text>

  <rect x="240" y="50" width="200" height="40" rx="8" fill="#fef3c7" stroke="#3a3126" stroke-width="2"/>
  <text x="340" y="76" font-size="15" text-anchor="middle" fill="#3a3126" font-weight="700">compare f(n) with n^log_b(a)</text>

  <line x1="340" y1="90" x2="120" y2="130" stroke="#3a3126" stroke-width="2"/>
  <line x1="340" y1="90" x2="340" y2="130" stroke="#3a3126" stroke-width="2"/>
  <line x1="340" y1="90" x2="560" y2="130" stroke="#3a3126" stroke-width="2"/>

  <!-- Case 1: f(n) = O(n^(log_b a - eps)) -->
  <rect x="20" y="130" width="200" height="80" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="120" y="156" font-size="13" text-anchor="middle" fill="#1e3a8a" font-weight="700">Case 1: leaves dominate</text>
  <text x="120" y="178" font-size="12.5" text-anchor="middle" fill="#1e3a8a">f(n) = O(n^(log_b a − ε))</text>
  <text x="120" y="198" font-size="13" text-anchor="middle" fill="#1e3a8a" font-weight="700">T(n) = Θ(n^log_b a)</text>

  <!-- Case 2: f(n) = Θ(n^log_b a) -->
  <rect x="240" y="130" width="200" height="80" rx="8" fill="#fef9c3" stroke="#b45309" stroke-width="2"/>
  <text x="340" y="156" font-size="13" text-anchor="middle" fill="#78350f" font-weight="700">Case 2: balanced</text>
  <text x="340" y="178" font-size="12.5" text-anchor="middle" fill="#78350f">f(n) = Θ(n^log_b a)</text>
  <text x="340" y="198" font-size="13" text-anchor="middle" fill="#78350f" font-weight="700">T(n) = Θ(n^log_b a · log n)</text>

  <!-- Case 3: f(n) = Ω(n^(log_b a + eps)) -->
  <rect x="460" y="130" width="200" height="80" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="560" y="156" font-size="13" text-anchor="middle" fill="#7f1d1d" font-weight="700">Case 3: root dominates</text>
  <text x="560" y="178" font-size="12.5" text-anchor="middle" fill="#7f1d1d">f(n) = Ω(n^(log_b a + ε))</text>
  <text x="560" y="198" font-size="13" text-anchor="middle" fill="#7f1d1d" font-weight="700">T(n) = Θ(f(n))</text>

  <text x="20" y="248" font-size="14" fill="#b45309" font-weight="700">Case 3 additionally requires the regularity condition: a·f(n/b) ≤ c·f(n) for some c &lt; 1.</text>

  <!-- Worked examples -->
  <text x="20" y="290" font-size="16" fill="#3a3126" font-weight="700">Worked examples</text>

  <rect x="20" y="302" width="640" height="150" rx="8" fill="#f8f5ec" stroke="#d8c9a8" stroke-width="1.5"/>
  <text x="36" y="326" font-size="13.5" fill="#3a3126">T(n) = 2T(n/2) + n      a=2, b=2 ⇒ n^log₂2 = n.  f(n)=n=Θ(n) ⇒ <tspan font-weight="700" fill="#78350f">Case 2 ⇒ Θ(n log n)</tspan> (merge sort)</text>
  <text x="36" y="352" font-size="13.5" fill="#3a3126">T(n) = 4T(n/2) + n      a=4 ⇒ n^log₂4 = n².  f(n)=n=O(n^(2−ε)) ⇒ <tspan font-weight="700" fill="#1e3a8a">Case 1 ⇒ Θ(n²)</tspan></text>
  <text x="36" y="378" font-size="13.5" fill="#3a3126">T(n) = 2T(n/2) + n²     a=2 ⇒ n^log₂2 = n.  f(n)=n²=Ω(n^(1+ε)) ⇒ <tspan font-weight="700" fill="#7f1d1d">Case 3 ⇒ Θ(n²)</tspan></text>
  <text x="36" y="404" font-size="13.5" fill="#3a3126">T(n) = T(2n/3) + 1      0&lt;b&lt;1?? not applicable directly; note n^log_b a with b=1.5, a=1 = 1 ⇒ <tspan font-weight="700">Case 2 ⇒ Θ(log n)</tspan></text>
  <text x="36" y="430" font-size="13.5" fill="#3a3126">T(n) = 2T(n/2) + n log n  f(n)=n log n not polynomially larger ⇒ falls between cases (use recursion tree)</text>

  <text x="20" y="468" font-size="13" fill="#7c3aed">Proof is not expected in the exam - apply the correct case and state the bound.</text>
</svg>