<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="'Segoe UI', system-ui, sans-serif">
  <text x="20" y="30" font-size="18" fill="#3a3126" font-weight="700">Recursion Tree for T(n) = 2T(n/2) + n   (Merge Sort)</text>

  <!-- Level 0: root n -->
  <rect x="350" y="55" width="60" height="34" rx="6" fill="#2563eb" opacity="0.15" stroke="#2563eb" stroke-width="2"/>
  <text x="380" y="77" font-size="14" text-anchor="middle" fill="#1e3a8a" font-weight="700">n</text>

  <!-- Level 1: two n/2 -->
  <rect x="250" y="140" width="60" height="34" rx="6" fill="#2563eb" opacity="0.15" stroke="#2563eb" stroke-width="2"/>
  <text x="280" y="162" font-size="13" text-anchor="middle" fill="#1e3a8a" font-weight="700">n/2</text>
  <rect x="450" y="140" width="60" height="34" rx="6" fill="#2563eb" opacity="0.15" stroke="#2563eb" stroke-width="2"/>
  <text x="480" y="162" font-size="13" text-anchor="middle" fill="#1e3a8a" font-weight="700">n/2</text>
  <line x1="370" y1="90" x2="290" y2="138" stroke="#3a3126" stroke-width="1.6"/>
  <line x1="390" y1="90" x2="470" y2="138" stroke="#3a3126" stroke-width="1.6"/>

  <!-- Level 2: four n/4 -->
  <rect x="170" y="225" width="60" height="34" rx="6" fill="#2563eb" opacity="0.12" stroke="#2563eb" stroke-width="2"/>
  <text x="200" y="247" font-size="13" text-anchor="middle" fill="#1e3a8a" font-weight="700">n/4</text>
  <rect x="290" y="225" width="60" height="34" rx="6" fill="#2563eb" opacity="0.12" stroke="#2563eb" stroke-width="2"/>
  <text x="320" y="247" font-size="13" text-anchor="middle" fill="#1e3a8a" font-weight="700">n/4</text>
  <rect x="410" y="225" width="60" height="34" rx="6" fill="#2563eb" opacity="0.12" stroke="#2563eb" stroke-width="2"/>
  <text x="440" y="247" font-size="13" text-anchor="middle" fill="#1e3a8a" font-weight="700">n/4</text>
  <rect x="530" y="225" width="60" height="34" rx="6" fill="#2563eb" opacity="0.12" stroke="#2563eb" stroke-width="2"/>
  <text x="560" y="247" font-size="13" text-anchor="middle" fill="#1e3a8a" font-weight="700">n/4</text>
  <line x1="265" y1="177" x2="210" y2="223" stroke="#3a3126" stroke-width="1.6"/>
  <line x1="295" y1="177" x2="310" y2="223" stroke="#3a3126" stroke-width="1.6"/>
  <line x1="465" y1="177" x2="440" y2="223" stroke="#3a3126" stroke-width="1.6"/>
  <line x1="495" y1="177" x2="540" y2="223" stroke="#3a3126" stroke-width="1.6"/>

  <!-- Level 3 leaves T(1) -->
  <rect x="110" y="310" width="60" height="34" rx="6" fill="#16a34a" opacity="0.15" stroke="#16a34a" stroke-width="2"/>
  <text x="140" y="332" font-size="13" text-anchor="middle" fill="#14532d" font-weight="700">T(1)</text>
  <rect x="210" y="310" width="60" height="34" rx="6" fill="#16a34a" opacity="0.15" stroke="#16a34a" stroke-width="2"/>
  <text x="240" y="332" font-size="13" text-anchor="middle" fill="#14532d" font-weight="700">T(1)</text>
  <rect x="310" y="310" width="60" height="34" rx="6" fill="#16a34a" opacity="0.15" stroke="#16a34a" stroke-width="2"/>
  <text x="340" y="332" font-size="13" text-anchor="middle" fill="#14532d" font-weight="700">T(1)</text>
  <rect x="410" y="310" width="60" height="34" rx="6" fill="#16a34a" opacity="0.15" stroke="#16a34a" stroke-width="2"/>
  <text x="440" y="332" font-size="13" text-anchor="middle" fill="#14532d" font-weight="700">T(1)</text>
  <rect x="510" y="310" width="60" height="34" rx="6" fill="#16a34a" opacity="0.15" stroke="#16a34a" stroke-width="2"/>
  <text x="540" y="332" font-size="13" text-anchor="middle" fill="#14532d" font-weight="700">T(1)</text>

  <line x1="185" y1="262" x2="145" y2="308" stroke="#3a3126" stroke-width="1.6"/>
  <line x1="215" y1="262" x2="235" y2="308" stroke="#3a3126" stroke-width="1.6"/>
  <line x1="305" y1="262" x2="335" y2="308" stroke="#3a3126" stroke-width="1.6"/>
  <line x1="335" y1="262" x2="345" y2="308" stroke="#3a3126" stroke-width="1.6"/>
  <line x1="425" y1="262" x2="435" y2="308" stroke="#3a3126" stroke-width="1.6"/>
  <line x1="455" y1="262" x2="525" y2="308" stroke="#3a3126" stroke-width="1.6"/>

  <!-- Cost per level (right side) -->
  <text x="640" y="78" font-size="14" fill="#b45309" font-weight="700">cost = n</text>
  <text x="640" y="163" font-size="14" fill="#b45309" font-weight="700">n/2 + n/2 = n</text>
  <text x="640" y="248" font-size="14" fill="#b45309" font-weight="700">n/4 ×4 = n</text>
  <text x="640" y="333" font-size="14" fill="#16a34a" font-weight="700">T(1) × n = c·n</text>
  <text x="640" y="380" font-size="15" fill="#3a3126" font-weight="700">Total = Θ(n log n)</text>

  <text x="20" y="390" font-size="14" fill="#3a3126">Depth = log₂n  ·  each level costs n  ·  leaves cost c·n</text>
  <text x="20" y="415" font-size="14" fill="#3a3126">n levels × n per level ⇒  T(n) = n·log₂n + c·n = Θ(n log n)</text>

  <!-- bottom rule showing log2n levels -->
  <line x1="80" y1="438" x2="600" y2="438" stroke="#3a3126" stroke-width="1"/>
  <text x="340" y="452" font-size="12" fill="#3a3126" text-anchor="middle">log₂n + 1 levels (height of the tree)</text>
</svg>