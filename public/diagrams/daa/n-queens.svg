<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" font-family="'Segoe UI', system-ui, sans-serif">
  <text x="20" y="30" font-size="18" fill="#3a3126" font-weight="700">N-Queens Backtracking - state space tree (N = 4)</text>
  <text x="20" y="52" font-size="13.5" fill="#b45309">Place queens row by row; prune any node where a new queen attacks an existing one.</text>

  <!-- Root -->
  <circle cx="60" cy="120" r="14" fill="#fef3c7" stroke="#3a3126" stroke-width="2"/>
  <text x="60" y="125" font-size="12" text-anchor="middle">∅</text>

  <!-- Row 1: c1..c4 -->
  <circle cx="150" cy="200" r="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="150" y="205" font-size="12" text-anchor="middle" fill="#1e3a8a">c1</text>
  <line x1="72" y1="128" x2="142" y2="190" stroke="#3a3126" stroke-width="1.6"/>

  <!-- From c1: row2 c3, c4 (c1,c2 attack) -->
  <circle cx="90" cy="290" r="14" fill="#fff" stroke="#16a34a" stroke-width="2"/>
  <text x="90" y="295" font-size="11" text-anchor="middle" fill="#14532d">c3</text>
  <circle cx="210" cy="290" r="14" fill="#fff" stroke="#16a34a" stroke-width="2"/>
  <text x="210" y="295" font-size="11" text-anchor="middle" fill="#14532d">c4</text>
  <line x1="142" y1="208" x2="96" y2="282" stroke="#3a3126" stroke-width="1.6"/>
  <line x1="158" y1="208" x2="204" y2="282" stroke="#3a3126" stroke-width="1.6"/>

  <!-- From (c1,c3): row3 c2 (c1,c4 attack) -->
  <circle cx="50" cy="380" r="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="50" y="385" font-size="11" text-anchor="middle" fill="#14532d">c2</text>
  <line x1="84" y1="298" x2="56" y2="372" stroke="#3a3126" stroke-width="1.6"/>

  <!-- Solution from (c1,c3,c2): row4 c4 -->
  <circle cx="50" cy="450" r="16" fill="#16a34a" stroke="#3a3126" stroke-width="2"/>
  <text x="50" y="455" font-size="10" text-anchor="middle" fill="#fff">c4</text>
  <line x1="50" y1="394" x2="50" y2="434" stroke="#3a3126" stroke-width="1.6"/>
  <text x="120" y="455" font-size="12.5" fill="#16a34a" font-weight="700">✓ solution (2,4,1,3)</text>

  <!-- From (c1,c4): row3 c2 (c3 attacks) -->
  <circle cx="230" cy="380" r="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="230" y="385" font-size="11" text-anchor="middle" fill="#7f1d1d">c2 ✓</text>
  <line x1="216" y1="298" x2="226" y2="372" stroke="#3a3126" stroke-width="1.6"/>

  <!-- Other c1 branches: c2 row1 -> row2 c4 only etc. Simplify: show a collision marker -->
  <circle cx="290" cy="290" r="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="290" y="295" font-size="11" text-anchor="middle" fill="#7f1d1d">✗</text>

  <!-- Row1 c2 branch -->
  <circle cx="230" cy="200" r="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="230" y="205" font-size="12" text-anchor="middle" fill="#7f1d1d">c2</text>
  <line x1="70" y1="132" x2="224" y2="192" stroke="#3a3126" stroke-width="1.6"/>

  <!-- Row1 c3 branch: boards are symmetric -->
  <circle cx="310" cy="200" r="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="310" y="205" font-size="12" text-anchor="middle" fill="#7f1d1d">c3</text>
  <line x1="64" y1="132" x2="304" y2="192" stroke="#3a3126" stroke-width="1.6"/>

  <!-- Row1 c4 -->
  <circle cx="390" cy="200" r="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="390" y="205" font-size="12" text-anchor="middle" fill="#1e3a8a">c4</text>
  <line x1="66" y1="132" x2="382" y2="192" stroke="#3a3126" stroke-width="1.6"/>
  <!-- c4,c1 row2 from c4 -->
  <circle cx="330" cy="290" r="14" fill="#fff" stroke="#16a34a" stroke-width="2"/>
  <text x="330" y="295" font-size="11" text-anchor="middle" fill="#14532d">c1</text>
  <circle cx="450" cy="290" r="14" fill="#fff" stroke="#16a34a" stroke-width="2"/>
  <text x="450" y="295" font-size="11" text-anchor="middle" fill="#14532d">c2</text>
  <line x1="382" y1="208" x2="336" y2="282" stroke="#3a3126" stroke-width="1.6"/>
  <line x1="398" y1="208" x2="444" y2="282" stroke="#3a3126" stroke-width="1.6"/>

  <!-- Solution mirror -->
  <circle cx="450" cy="450" r="16" fill="#16a34a" stroke="#3a3126" stroke-width="2"/>
  <text x="450" y="455" font-size="10" text-anchor="middle" fill="#fff">c3</text>
  <line x1="450" y1="304" x2="450" y2="434" stroke="#3a3126" stroke-width="1.6"/>
  <text x="490" y="455" font-size="12.5" fill="#16a34a" font-weight="700">✓ solution (3,1,4,2)</text>

  <!-- Key -->
  <rect x="520" y="150" width="160" height="120" rx="8" fill="#f8f5ec" stroke="#d8c9a8" stroke-width="1.5"/>
  <text x="536" y="176" font-size="12.5" fill="#3a3126" font-weight="700">Key</text>
  <text x="536" y="196" font-size="12" fill="#14532d">blue = placing a queen</text>
  <text x="536" y="216" font-size="12" fill="#7f1d1d">red ✗ = attacked column</text>
  <text x="536" y="236" font-size="12" fill="#3a3126">leaf = complete placement</text>
  <text x="536" y="256" font-size="12" fill="#16a34a" font-weight="700">green = solution</text>

  <text x="20" y="478" font-size="13" fill="#3a3126">Backtracking prunes the tree by checking column + diagonal conflicts at every level instead of trying all 4! = 24 permutations.</text>
</svg>